    <!-- SCRIPT DA LÓGICA DO QUIZ -->
    <script>
        // BANCO DE DADOS DE PERGUNTAS (Adaptado para 6º Ano)
        const quizQuestions = [
            {
                category: "🍕 Comida de Rua",
                question: "Onde os romanos que não tinham cozinha em casa costumavam comprar comida rápida e quente na rua?",
                options: [
                    "Nos grandes supermercados romanos",
                    "No Thermopolium (a lanchonete da antiguidade)",
                    "Apenas nas padarias do Imperador",
                    "Eles não comiam comida quente na rua"
                ],
                correct: 1,
                explanation: "O **Thermopolium** era como o 'fast-food' da Roma Antiga! Tinha balcões com potes de cerâmica embutidos que mantinham a comida quentinha para os trabalhadores e plebeus."
            },
            {
                category: "🐟 Tempero Famoso",
                question: "Qual era o molho salgado super famoso e essencial, feito com peixes fermentados ao sol?",
                options: [
                    "Ketchup de tomate",
                    "Garum",
                    "Maionese romana",
                    "Molho Xadrez"
                ],
                correct: 1,
                explanation: "O **Garum** era o tempero nº 1 de Roma! Feito com peixes e sal deixados ao sol por semanas, ele dava um sabor bem salgado e marcante para quase todos os pratos."
            },
            {
                category: "🛋️ Banquetes e Luxo",
                question: "Como os romanos ricos (patrícios) se acomodavam para comer nos banquetes chiques?",
                options: [
                    "Em pé ao redor de uma fogueira",
                    "Sentados em cadeiras de balanço",
                    "Deitados de lado em sofás confortáveis (triclínios)",
                    "Ajoelhados no chão de pedra"
                ],
                correct: 2,
                explanation: "Nos banquetes, os ricos comiam **deitados de lado em sofás chamados triclínios**. Eles achavam esse estilo super chique, relaxante e símbolo de nobreza!"
            },
            {
                category: "🥣 O Prato do Povo",
                question: "Qual era o prato mais simples, barato e comum do dia a dia dos soldados e plebeus?",
                options: [
                    "A 'Puls' (um mingau de grãos e cereais)",
                    "Hambúrguer de carne de urso",
                    "Sopa de batata frita",
                    "Pizza recheada com queijo"
                ],
                correct: 0,
                explanation: "A **Puls** era uma papinha/mingau feito cozinhando grãos de trigo ou cevada na água com sal. Às vezes adicionavam legumes ou queijo quando tinham dinheiro."
            },
            {
                category: "🍯 Doces Romanos",
                question: "Como os romanos não conheciam o açúcar de cana moderno, o que eles usavam para adoçar doces e vinhos?",
                options: [
                    "Açúcar mascavo importado",
                    "Mel de abelha natural",
                    "Adoçante artificial",
                    "Suco de limão concentrado"
                ],
                correct: 1,
                explanation: "O **Mel** era o grande 'ouro doce' da antiguidade! Era usado para adoç,
                question: "Como os romanos costumavam beber o vinho para ele não ficar forte e amargo demais?",
                options: [
                    "Puro e bem gelado com gelo",
                    "Misturado com água, mel e ervas",
                    "Fervido até virar refrigerante",
                    "Misturado com leite de cabra"
                ],
                correct: 1,
                explanation: "Beber vinho puro era visto como hábito 'bárbaro' pelos romanos! Eles **sempre misturavam o vinho com água** (quente ou fria) e adicionavam mel e especiarias."
            },
            {
                category: "🖐️ Modos à Mesa",
                question: "Como a maioria dos romanos comia os alimentos na mesa durante as refeições?",
                options: [
                    "Usando garfos de plástico moderno",
                    "Apenas com hashis (palitinhos orientais)",
                    "Diretamente com as mãos e o auxílio de colheres",
                    "Não tocavam na comida, eram alimentados por robôs"
                ],
                correct: 2,
                explanation: "O garfo como conhecemos não existia na Roma Antiga! Eles **comiam quase tudo com as mãos** e usavam colheres e facas para cortar as carnes."
            },
            {
                category: "🌿 Rota de Temperos",
                question: "Quais especiarias valiosas vinham de longe (do Oriente) para dar sabor à comida dos ricos em Roma?",
                options: [
                    "Pimenta-do-reino e canela",
                    "Orégano e manjericão em pó",
                    "Ketchup e mostarda amarela",
                    "Páprica doce e chimichurri"
                ],
                correct: 0,
                explanation: "A **pimenta-do-reino e a canela** vinham de rotas comerciais distantes da Ásia e Índia. Eram tão caras que valiam quase o seu peso em prata!"
            },
            {
                category: "🏛️ Mitos da História",
                question: "O que era na verdade o 'vomitório' (vomitorium) nos grandes edifícios romanos?",
                options: [
                    "Um quarto nojento para vomitar a comida dos banquetes",
                    "As saídas e corredores largos para esvaziar o Coliseu rapidamente",
                    "Um banheiro público exclusivo para imperadores",
                    "O local onde guardavam os restos de comida"
                ],
                correct: 1,
                explanation: "Mito detonado! O **vomitório** vem do latim *vomere* (expelir). Era apenas o nome das portas e corredores de saída rápida dos estádio para 'expelir' a multidão!"
            },
            {
                category: "🍞 Política e Povo",
                question: "O que significava a famosa estratégia dos imperadores chamada 'Pão e Circo'?",
                options: [
                    "Uma receita de pão em formato de palhaço de circo",
                    "Distribuir comida de graça e espetáculos divertidos para acalmar o povo",
                    "Obrigado todos os padeiros a trabalharem no circo",
                    "Proibir a população de comer trigo durante as festas"
                ],
                correct: 1,
                explanation: "'Pão e Circo' era a política para manter a população de Roma quieta e feliz: dava-se **trigo gratuito (pão)** e **corridas de bigas e lutas no Coliseu (circo)**."
            }
        ];

        // VARIÁVEIS DE ESTADO DO JOGO
        let currentQuestionIndex = 0;
        let score = 0;
        let correctAnswersCount = 0;
        let streak = 0;
        let isAnswered = false;

        // EFEITOS SONOROS SIMULADOS COM WEB AUDIO API
        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2); // A5
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime); // A3
                    osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.4, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.6);
                }
            } catch (e) {
                // Navegador pode bloquear áudio automático
            }
        }

        // INICIAR O QUIZ
        function startQuiz() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            document.getElementById('screen-result').classList.add('hidden');

            currentQuestionIndex = 0;
            score = 0;
            correctAnswersCount = 0;
            streak = 0;
            updateScoreDisplay();
            loadQuestion();
        }

        // CARREGAR PERGUNTA ATUAL
        function loadQuestion() {
            isAnswered = false;
            const q = quizQuestions[currentQuestionIndex];

            // Atualiza contador e progresso
            document.getElementById('question-count').innerText = `Pergunta ${currentQuestionIndex + 1} de ${quizQuestions.length}`;
            document.getElementById('question-category').innerText = q.category;
            document.getElementById('question-text').innerText = q.question;

            const progressPercent = ((currentQuestionIndex + 1) / quizQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Oculta caixa de feedback e botão próximo
            document.getElementById('feedback-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.remove('flex');

            // Renderiza opções
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const letters = ['A', 'B', 'C', 'D'];

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-2xl bg-slate-900/80 hover:bg-slate-800 border-2 border-slate-700/80 hover:border-neonPurple/60 text-slate-200 transition-all duration-200 flex items-center justify-between group animate-pop`;
                btn.style.animationDelay = `${idx * 0.08}s`;
                btn.onclick = () => checkAnswer(idx);

                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-xl bg-slate-800 border border-slate-600 text-neonPurpleLight group-hover:bg-neonPurple group-hover:text-white group-hover:border-neonPurple font-title font-bold flex items-center justify-center text-sm transition">
                            ${letters[idx]}
                        </span>
                        <span class="text-sm sm:text-base font-medium">${opt}</span>
                    </div>
                    <i class="fa-regular fa-circle text-slate-600 group-hover:text-neonPurpleLight text-lg transition"></i>
                `;
                optionsContainer.appendChild(btn);
            });
        }

        // VERIFICAR RESPOSTA SELECIONADA
        function checkAnswer(selectedIndex) {
            if (isAnswered) return;
            isAnswered = true;

            const q = quizQuestions[currentQuestionIndex];
            const optionsContainer = document.getElementById('options-container');
            const buttons = optionsContainer.children;
            const feedbackBox = document.getElementById('feedback-box');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackText = document.getElementById('feedback-text');

            const isCorrect = selectedIndex === q.correct;

            if (isCorrect) {
                playSound('correct');
                score += 100 + (streak * 20); // Bônus por combo
                correctAnswersCount++;
                streak++;

                // Exibe combo se for maior que 1
                if (streak > 1) {
                    document.getElementById('streak-count').innerText = streak;
                    document.getElementById('streak-badge').classList.remove('hidden');
                }

                // Estilo do botão selecionado (Certo)
                buttons[selectedIndex].className = "w-full text-left p-4 rounded-2xl bg-emerald-950/80 border-2 border-emerald-500 text-emerald-200 font-medium flex items-center justify-between";
                buttons[selectedIndex].querySelector('i').className = "fa-solid fa-circle-check text-emerald-400 text-xl";

                // Estilo da caixa de feedback
                feedbackBox.className = "rounded-2xl p-4 mb-6 bg-emerald-950/60 border border-emerald-500/50 text-emerald-200 block animate-pop";
                feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i>`;
                feedbackTitle.innerText = "Resposta Correta! Bravo, Romano!";
            } else {
                playSound('wrong');
                streak = 0;
                document.getElementById('streak-badge').classList.add('hidden');

                // Estilo do botão selecionado (Errado)
                buttons[selectedIndex].className = "w-full text-left p-4 rounded-2xl bg-rose-950/80 border-2 border-rose-500 text-rose-200 font-medium flex items-center justify-between";
                buttons[selectedIndex].querySelector('i').className = "fa-solid fa-circle-xmark text-rose-400 text-xl";

                // Destaca a opção correta
                buttons[q.correct].className = "w-full text-left p-4 rounded-2xl bg-emerald-950/50 border-2 border-emerald-500/80 text-emerald-300 font-medium flex items-center justify-between";

                // Estilo da caixa de feedback
                feedbackBox.className = "rounded-2xl p-4 mb-6 bg-rose-950/60 border border-rose-500/50 text-rose-200 block animate-pop";
                feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-400"></i>`;
                feedbackTitle.innerText = "Ops! Quase lá...";
            }

            // Desativa todos os botões
            for (let btn of buttons) {
                btn.disabled = true;
                btn.classList.remove('hover:border-neonPurple/60', 'hover:bg-slate-800');
            }

            // Atualiza texto de explicação
            feedbackText.innerHTML = q.explanation;

            // Mostra o botão Próxima
            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.remove('hidden');
            nextBtn.classList.add('flex');

            updateScoreDisplay();
        }

        // PRÓXIMA PERGUNTA OU FINALIZAR
        function nextQuestion() {
            currentQuestionIndex++;

            if (currentQuestionIndex < quizQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // ATUALIZA PONTUAÇÃO NO TOPO
        function updateScoreDisplay() {
            document.getElementById('score-display').innerText = `${score} pts`;
        }

        // EXIBE A TELA DE RESULTADOS COM MEDALHAS
        function showResults() {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');

            playSound('win');

            // Solta confetes festivos
            try {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#a855f7', '#c084fc', '#fbbf24', '#38bdf8']
                });
            } catch (e) {}

            document.getElementById('stat-correct').innerText = `${correctAnswersCount}/${quizQuestions.length}`;
            document.getElementById('stat-score').innerText = `${score} pts`;

            // Cálculo do Rank / Medalha
            const medalIconBox = document.getElementById('medal-icon-box');
            const rankTitleBadge = document.getElementById('rank-title-badge');
            const resultMessage = document.getElementById('result-message');
            const rankDescription = document.getElementById('rank-description');

            if (correctAnswersCount >= 9) {
                // Imperador / Patrício
                medalIconBox.innerHTML = "🏛️";
                medalIconBox.className = "w-24 h-24 rounded-3xl bg-gradient-to-tr from-amber-400 to-yellow-200 text-slate-950 flex items-center justify-center text-5xl mx-auto mb-4 shadow-xl glow-purple-box";
                rankTitleBadge.innerText = "RANK: IMPERADOR DO BANQUETE";
                rankTitleBadge.className = "inline-block px-4 py-1.5 rounded-full text-xs font-extrabold uppercase tracking-widest bg-amber-400/20 text-amber-300 border border-amber-400/40 mb-2";
                resultMessage.innerText = "Incrível! Você dominou todos os segredos da culinária da Roma Antiga!";
                rankDescription.innerHTML = "🏆 <strong>Conquista de Ouro:</strong> Você conhece a história como um verdadeiro Patrício nobre! Sabe exatamente o que colocar no prato do Imperador.";
            } else if (correctAnswersCount >= 6) {
                // Centurião / Gladiador
                medalIconBox.innerHTML = "⚔️";
                medalIconBox.className = "w-24 h-24 rounded-3xl bg-gradient-to-tr from-purple-500 to-neonPurpleLight text-white flex items-center justify-center text-5xl mx-auto mb-4 shadow-xl glow-purple-box";
                rankTitleBadge.innerText = "RANK: GLADIADOR CULINÁRIO";
                rankTitleBadge.className = "inline-block px-4 py-1.5 rounded-full text-xs font-extrabold uppercase tracking-widest bg-purple-400/20 text-purple-300 border border-purple-400/40 mb-2";
                resultMessage.innerText = "Muito bem! Seu conhecimento histórico é afiado!";
                rankDescription.innerHTML = "⚔️ <strong>Conquista de Prata:</strong> Você venceu a maioria dos desafios do banquete! Já pode abrir seu próprio Thermopolium pelas ruas de Roma.";
            } else {
                // Plebeu Aprendiz
                medalIconBox.innerHTML = "🍞";
                medalIconBox.className = "w-24 h-24 rounded-3xl bg-gradient-to-tr from-slate-600 to-slate-400 text-white flex items-center justify-center text-5xl mx-auto mb-4 shadow-xl";
                rankTitleBadge.innerText = "RANK: PLEBEU APRENDIZ";
                rankTitleBadge.className = "inline-block px-4 py-1.5 rounded-full text-xs font-extrabold uppercase tracking-widest bg-slate-400/20 text-slate-300 border border-slate-400/40 mb-2";
                resultMessage.innerText = "Bom esforço! Que tal jogar de novo para virar um mestre da história?";
                rankDescription.innerHTML = "🍞 <strong>Conquista de Bronze:</strong> Você já sabe o básico sobre a Puls e o Garum! Jogue novamente para memorizar todos os fatos e subir de rank.";
            }
        }

        // REINICIAR O QUIZ
        function restartQuiz() {
            startQuiz();
        }
    </script>
</body>
</html>
